<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div class="wrapper">
    <div class="top-bar">
      <h1 class="game-title">TETRIS</h1>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema claro/oscuro" title="Cambiar tema">
        <span class="theme-toggle-icon">🌙</span>
        <span class="theme-toggle-track"></span>
        <span class="theme-toggle-icon">☀️</span>
      </button>
    </div>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section records">
          <span class="label">RÉCORDS</span>
          <ol id="highscore-list" class="highscore-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <strong id="best-combo-value">0</strong></span>
            <span>Líneas máximas: <strong id="max-lines-value">0</strong></span>
          </div>
          <button type="button" id="reset-highscores-btn" class="reset-btn">Reiniciar récords</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="highscore-entry" class="highscore-entry hidden">
          <p class="highscore-entry-label">¡Nuevo récord! Ingresa tu nombre:</p>
          <div class="highscore-entry-row">
            <input type="text" id="player-name-input" maxlength="12" placeholder="Nombre" autocomplete="off" />
            <button type="button" id="save-score-btn">Guardar</button>
          </div>
        </div>
        <div id="overlay-highscores" class="panel-section records overlay-records hidden">
          <span class="label">RÉCORDS</span>
          <ol id="overlay-highscore-list" class="highscore-list"></ol>
        </div>
        <div id="powerup-legend" class="powerup-legend hidden"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
